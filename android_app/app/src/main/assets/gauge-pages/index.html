<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; script-src 'self' file:; style-src 'self' file:">
<title>仪表页面设置</title><link rel="stylesheet" href="pages.css"></head>
<body><main><header><button id="back" hidden>‹ 仪表设置</button><h1>仪表页面设置</h1><p id="status"></p></header>
<section class="preview"><div class="stage"><button id="prev" aria-label="上一页">‹</button><div id="dial" role="img" aria-label="模拟仪表"><canvas width="466" height="466"></canvas><img alt="模拟仪表画面" hidden></div><button id="next" aria-label="下一页">›</button></div>
<div class="caption"><strong id="title"></strong><span id="position"></span></div><small>默认主题 · 模拟数据 · 左右滑动预览</small><p id="previewError" hidden>仪表预览图未能加载。</p></section>
<section><div class="heading"><h2>页面顺序</h2><select id="add" aria-label="添加页面"></select></div><div id="pages"></div></section>
<section id="edit"><div class="heading"><h2 id="editTitle"></h2></div><div id="items"></div><div class="actions"><button id="up">上移</button><button id="down">下移</button><button id="remove">移除页面</button></div></section>
<p class="foot">版本与设置固定为第 1 页。从这里向左滑动，依次进入下方编排的仪表页。</p>
</main><script src="pages.js"></script></body></html>
